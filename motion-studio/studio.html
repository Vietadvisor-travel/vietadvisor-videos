<script>
const ENGINE=['geo_data','core','rig','acting','charstyle','presets','props_food','props_objects','props_vehicles','props_nature','places','physics','map','ui','fx','look','camera','timeline','cinema','stickers','generators','post','storyboard','beats','world','setpieces','framing','sheets'];
window.READY=(async()=>{
  for(const f of ENGINE){await new Promise((res)=>{const s=document.createElement('script');s.src='engine/'+f+'.js';s.onload=res;s.onerror=()=>{console.log('missing '+f);res()};document.body.appendChild(s);});}
  await new Promise(res=>{const s=document.createElement('script');s.src='engine/library/index.js';s.onload=res;s.onerror=res;document.body.appendChild(s);});
  for(const f of (window.LIBRARY||[])){await new Promise(res=>{const s=document.createElement('script');s.src='engine/library/'+f+'.js';s.onload=res;s.onerror=()=>{console.log('missing library '+f);res()};document.body.appendChild(s);});}
  await new Promise(res=>{const s=document.createElement('script');s.src='engine/library/images.js';s.onload=res;s.onerror=res;document.body.appendChild(s);}); await loadImages();
  const ep=new URLSearchParams(location.search).get('ep'); if(ep){await new Promise(res=>{const s=document.createElement('script');s.src=ep;s.onload=res;s.onerror=()=>{console.log('missing ep');res()};document.body.appendChild(s);});}
  const sample='Ha Giang Hà Giang ĐƯỜNG TÀU Ầ Ặ Ờ Ữ ẫ ₫ 하장 ハザン 河江 ฮาซาง';
  for(const f of ['400 40px "Sigmar One"','400 40px "Coiny"','400 40px "Paytone One"','400 40px "Bangers"','800 40px "Baloo 2"','800 40px "Be Vietnam Pro"','900 40px "Be Vietnam Pro"','600 40px "Be Vietnam Pro"','800 40px Kanit','900 40px "Noto Sans KR"','900 40px "Noto Sans JP"','900 40px "Noto Sans SC"','400 40px Anton','700 40px Oswald','500 40px Oswald','900 40px "Playfair Display"','700 40px "Playfair Display"','400 40px Bangers','400 40px Pacifico','400 40px "Patrick Hand"','400 40px Bungee']) await document.fonts.load(f,sample);
  await document.fonts.ready; ctx=document.getElementById('c').getContext('2d'); return true;})();
